name: ci

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test

  docker:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Dokploy webhook (staging)
        env:
          DOKPLOY_WEBHOOK_URL_STAGING: ${{ secrets.DOKPLOY_WEBHOOK_URL_STAGING }}
          PACKAGE_URL: ghcr.io/${{ github.repository }}:staging
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_WEBHOOK_URL_STAGING:-}" ]; then
            echo "Add environment secret DOKPLOY_WEBHOOK_URL_STAGING on GitHub Environment 'staging'."
            exit 1
          fi
          echo "Deploying ${PACKAGE_URL}"
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL_STAGING" \
            -H "Content-Type: application/json" \
            -H "x-github-event: registry_package" \
            -d "{\"registry_package\":{\"package_version\":{\"package_url\":\"${PACKAGE_URL}\"}}}"
          echo

  deploy-production:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Dokploy webhook (production)
        env:
          DOKPLOY_WEBHOOK_URL_MAIN: ${{ secrets.DOKPLOY_WEBHOOK_URL_MAIN }}
          PACKAGE_URL: ghcr.io/${{ github.repository }}:latest
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_WEBHOOK_URL_MAIN:-}" ]; then
            echo "Add environment secret DOKPLOY_WEBHOOK_URL_MAIN on GitHub Environment 'production'."
            exit 1
          fi
          echo "Deploying ${PACKAGE_URL}"
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL_MAIN" \
            -H "Content-Type: application/json" \
            -H "x-github-event: registry_package" \
            -d "{\"registry_package\":{\"package_version\":{\"package_url\":\"${PACKAGE_URL}\"}}}"
          echo
