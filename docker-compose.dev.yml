name: mykwatta-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: mykwatta-dev-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mykwatta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mykwatta']
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: mykwatta-dev-rustfs
    restart: unless-stopped
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-mykwatta}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-mykwatta-secret-change-me}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs/
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/var/log/rustfs/
    command: ['/data']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mykwatta-dev-api
    restart: unless-stopped
    ports:
      - '${PORT:-3005}:${PORT:-3005}'
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    command: ['pnpm', 'run', 'start:dev']

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mykwatta-dev-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: ['pnpm', 'run', 'start:worker:dev']

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
