services:
  api:
    image: ${MYKWATTA_IMAGE:-ghcr.io/zeldris600/mykwatta:staging}
    pull_policy: always
    restart: unless-stopped
    ports:
      # Host and container use the same PORT from Dokploy env (e.g. 3005).
      - '${PORT:-3005}:${PORT:-3005}'
    env_file:
      - .env
    command: ['node', 'dist/src/main.js']

  worker:
    image: ${MYKWATTA_IMAGE:-ghcr.io/zeldris600/mykwatta:staging}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ROLE: worker
    depends_on:
      - api
    command: ['node', 'dist/src/worker.js']
