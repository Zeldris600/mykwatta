name: mykwatta

services:
  api:
    image: ${MYKWATTA_IMAGE:-ghcr.io/zeldris600/mykwatta:latest}
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ROLE: api
    command: ['node', 'dist/src/main.js']

  worker:
    image: ${MYKWATTA_IMAGE:-ghcr.io/zeldris600/mykwatta:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ROLE: worker
    depends_on:
      - api
    command: ['node', 'dist/src/worker.js']
